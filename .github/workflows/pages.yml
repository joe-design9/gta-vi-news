name: Update news and deploy Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh public press feed
        id: refresh
        continue-on-error: true
        run: python scripts/update_news.py
      - name: Record changed news
        if: steps.refresh.outcome == 'success'
        run: |
          if ! git diff --quiet -- news.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add news.json
            git commit -m "Update GTA VI press feed"
            git push
          fi
      - name: Prepare public files only
        run: |
          mkdir -p _site
          cp index.html styles.css app.js news.json favicon.svg _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
